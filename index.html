<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LR Maker</title>
<style>
:root{--bg:#dfe1e3;--card:#f7f7f5;--ink:#1c2430;--mute:#4a5562;--line:#7f8791;--soft:#c9cdd2;--bar:#25364f;--bar-ink:#fff;--pri:#25364f;--pri-ink:#fff;--bad:#b3261e;--inp:#fff;--inp-ink:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16191d;--card:#22262b;--ink:#e3e6e9;--mute:#9aa3ad;--line:#5a626c;--soft:#363c44;--bar:#31435f;--bar-ink:#fff;--pri:#4a6591;--pri-ink:#fff;--bad:#ff8a80;--inp:#14171a;--inp-ink:#e3e6e9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16191d;--card:#22262b;--ink:#e3e6e9;--mute:#9aa3ad;--line:#5a626c;--soft:#363c44;--bar:#31435f;--bar-ink:#fff;--pri:#4a6591;--pri-ink:#fff;--bad:#ff8a80;--inp:#14171a;--inp-ink:#e3e6e9;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 Verdana,Tahoma,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px 0;background:var(--bar);color:var(--bar-ink);border-bottom:3px double #b9a766}
h1{font:bold 17px Georgia,"Times New Roman",serif;margin:0 0 8px;letter-spacing:.3px}
.cos{display:flex;align-items:center;gap:6px;color:var(--bar-ink);font-size:13px;margin:0 0 8px}
header select{background:#fff;color:#111;border:1px solid #000;font-weight:bold;width:auto}
header .chip{color:#cfd6df;border-color:#56677f;margin:0 0 8px}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:#3d506b;color:#fff;border:1px solid #14202f;border-bottom:0;box-shadow:none;padding:7px 16px}
nav button.on{background:var(--card);color:var(--ink)}
button,.btn{font:inherit;color:var(--ink);background:var(--btn,#eceae6);border:1px solid #333;border-radius:0;padding:5px 11px;cursor:pointer;box-shadow:1px 1px 0 #555}
.btn{display:inline-block;font-weight:normal}
button:active{transform:translate(1px,1px);box-shadow:none}
button.on{background:var(--pri);color:var(--pri-ink)}
button.pri{background:var(--pri);color:var(--pri-ink);font-weight:bold}
:focus-visible{outline:2px solid #c9a227;outline-offset:0}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--soft);padding:2px 8px}
main{display:grid;grid-template-columns:minmax(320px,470px) 1fr;gap:14px;padding:14px;max-width:1600px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);padding:0 12px 12px;box-shadow:2px 2px 0 var(--soft)}
.ttl{margin:0 -12px 0!important;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
#lrTitle{font:bold 16px Georgia,"Times New Roman",serif}
fieldset{border:1px solid var(--line);margin:12px 0 0;padding:8px 10px 10px}
legend{background:var(--bar);color:var(--bar-ink);font-weight:bold;padding:2px 10px;font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .w{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:bold;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--inp-ink);background:var(--inp);border:1px solid var(--line);border-radius:0;padding:5px 6px;margin-top:2px;box-shadow:inset 1px 1px 2px #0002}
textarea{resize:vertical;min-height:56px}
.bad{outline:2px solid var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.scroll{overflow-x:auto;padding-bottom:8px}
#preview{background:#aeb3b9;padding:10px;width:max-content;min-width:100%}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--soft);padding:5px 8px;text-align:left}
th{background:var(--soft)}tr.r{cursor:pointer}tr.r:nth-child(even){background:#00000008}tr.r:hover{background:#c9b46a44}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;border:1px solid #b9a766;padding:8px 14px;max-width:90vw;display:none;z-index:9}
.hide{display:none!important}#vHist,#vCo,#vUsr{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn:#3b424a}}:root[data-theme="dark"]{--btn:#3b424a}
:root{--c-route:#1f6fb2;--c-ship:#c2571a;--c-recv:#2e8b57;--c-cons:#7b3fa0;--c-dim:#8f6a00;--c-chg:#b02a4a}
[data-s=route]{--sc:var(--c-route)}[data-s=ship]{--sc:var(--c-ship)}[data-s=recv]{--sc:var(--c-recv)}[data-s=cons]{--sc:var(--c-cons)}[data-s=dim]{--sc:var(--c-dim)}[data-s=chg]{--sc:var(--c-chg)}
fieldset[data-s]{border:1px solid var(--sc);border-left:6px solid var(--sc)}
fieldset[data-s] legend{background:var(--sc);color:#fff}
fieldset[data-s] :is(input,select,textarea):focus{outline:none;border-color:var(--sc);box-shadow:0 0 0 2px var(--sc);background:color-mix(in srgb,var(--sc) 16%,var(--inp))}
#preview [data-s].act{background:color-mix(in srgb,var(--sc) 22%,#fff);outline:2px solid var(--sc)}
/* ---- LR sheet (always paper-white) ---- */
.lr{width:190mm;height:136mm;border:1px solid #000;padding:2mm;background:#fff;color:#111;font:7.5pt/1.3 Arial,sans-serif;display:flex;flex-direction:column;gap:1.5mm;margin:0 0 8px;overflow:hidden}
.lr .top{display:flex;justify-content:space-between;align-items:center;height:17mm}
.lr .logo{height:15mm;max-width:50mm;object-fit:contain;font:italic 900 15pt Arial;color:#000;display:flex;align-items:center}
.lr .brand{display:flex;align-items:center;gap:3mm}.lr .bt b{display:block;font:bold 14pt Arial;color:#000}.lr .bt i{font-size:8pt;color:#333}.lr .cq{font-size:6pt;line-height:1.2}.lr .no{text-align:right}.lr .no b{display:block;font:bold 15pt "Courier New",monospace;letter-spacing:1px}
.lr svg{display:block;margin-left:auto}
.lr .cp{font:bold 7pt "Courier New",monospace;border:1px solid #111;padding:0 4px;display:inline-block;margin-bottom:1px}
.lr .cols{flex:1;display:grid;grid-template-columns:48% 1fr;gap:2mm;min-height:0}
.lr .col{display:flex;flex-direction:column;gap:1.2mm;min-height:0}
.rl{border-bottom:1px solid #000;color:#000;font:bold 7.5pt "Courier New",monospace;padding:1px 0}
.bx{border:.5px solid #000;border-radius:0;padding:1.2mm;font:7.5pt "Courier New",monospace;white-space:pre-line;flex:1}
.carrier{color:#000;font-size:7pt;font-weight:bold}
.kv{display:grid;grid-template-columns:auto 1fr;border:.5px solid #000}
.kv>*{padding:1px 4px;border-bottom:.5px solid #666}.kv>span:nth-child(odd){border-right:.5px solid #666}
.kv b{font:bold 7pt "Courier New",monospace}
.rt{display:grid;grid-template-columns:1fr 1fr;border:.5px solid #000;font:bold 9pt "Courier New",monospace}.rt div{padding:1px 4px}.rt small{display:block;border-bottom:1px solid #000;color:#000;font-size:7pt;margin:-1px -4px 1px;padding:0 4px}
.mode{font:bold 7pt "Courier New",monospace}.mode div{padding:0 4px}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:2mm;font-size:6.2pt;border:.5px solid #000;padding:1mm}
.terms p{margin:0}
.foot{border-top:1px solid #000;color:#000;font:bold 6.8pt "Courier New",monospace;padding:1px 4px;display:flex;justify-content:space-between;gap:4px}
@page{size:A4;margin:8mm}
#print{display:none}
@media print{
 body{background:#fff}#app,.toast,header{display:none!important}
 #print{display:block}.lr{margin:0 auto;border-color:#000}
 .lr:nth-child(2n){break-after:page}.lr:nth-child(2n+1){margin-bottom:5mm}
}
</style></head>
<body>
<div id="login" style="position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center"><div class="panel" style="width:min(360px,92vw);padding:16px"><h1 style="color:var(--ink);margin:0 0 4px">Lorry Receipt Register</h1><p style="margin:0 0 12px;color:var(--mute)">PMJ Solutions / PMJ-Logistics Solutions LLP</p><label>User ID<input id="lgId" autocomplete="username"></label><label style="margin-top:8px">Password<input id="lgPw" type="password" autocomplete="current-password"></label><p id="lgErr" style="color:var(--bad);min-height:18px;margin:8px 0"></p><button class="pri" id="lgGo" style="width:100%">Log in</button></div></div>
<header>
 <h1>Lorry Receipt Register</h1>
 <label class="cos">Company <select id="co" style="margin:0"></select></label><nav class="tabs"><button id="tNew" class="on">New LR</button><button id="tHist">History</button><button id="tCo" class="hide">Company</button><button id="tUsr" class="hide">Users</button></nav>
 <span class="chip" id="who"></span><button id="bPw">Change password</button><button id="bOut">Log out</button>
</header>
<div id="app">
<main id="vNew">
 <section class="panel">
  <div class="bar ttl"><b id="lrTitle"></b><span class="chip" id="uid"></span></div>
  <form id="f" onsubmit="return false"></form>
 </section>
 <section>
  <div class="bar">
   <div class="tabs" id="copyTabs"></div>
   <button class="pri" id="bSave">Save LR</button><button class="pri" id="bSP">Save &amp; Print</button><button id="bRep">Repeat last</button>
   <button id="bPrint">Print 4 copies</button>
   <button id="bPdf">Download PDF</button>
   <button id="bWa">Share on WhatsApp</button>
   <button id="bMail">Email</button>
   <label class="btn" style="margin:0">Upload logo<input id="logoIn" type="file" accept="image/*" class="hide"></label><span class="chip">Enter = next field &nbsp; Ctrl+S = save</span>
  </div>
  <div class="scroll"><div id="preview"></div></div>
 </section>
</main>
<main id="vUsr" class="hide"><section class="panel" style="max-width:780px"><div class="bar ttl"><b>Users</b></div>
<div class="g" style="margin-top:10px"><label>User ID<input id="uId"></label><label>Name<input id="uNm"></label><label>Password (min 6)<input id="uPw"></label><label>Role<select id="uRl"><option>staff</option><option>admin</option></select></label></div>
<div class="bar"><button class="pri" id="uAdd">Add user</button></div>
<table><thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="uRows"></tbody></table>
<div class="bar ttl" style="margin-top:14px"><b>Next LR number</b></div><div class="bar" id="nxt"></div></section></main>
<main id="vCo" class="hide"><section class="panel" style="max-width:640px"><p id="coNote" style="color:var(--mute);margin-top:0"></p><div id="coForm" class="g"></div><div class="bar" style="margin-top:14px"><label class="btn" style="margin:0">Upload this company’s logo<input id="logoIn2" type="file" accept="image/*" class="hide"></label></div></section></main>
<main id="vHist" class="hide">
 <section class="panel">
  <div class="bar"><input id="q" placeholder="Search by LR number, party, vehicle, user or date" style="max-width:380px;margin:0"><label style="display:flex;align-items:center;gap:4px;margin:0"><input id="mine" type="checkbox" style="width:auto;margin:0"> My LRs only</label><button id="bRef">Refresh</button><span class="chip" id="cnt"></span></div>
  <div id="det" class="hide" style="margin-bottom:12px"></div><div class="scroll"><table><thead><tr><th>LR no.</th><th>Unique ID</th><th>Date</th><th>Shipper</th><th>Receiver</th><th>Pcs / Kg</th><th>By</th><th>Rem.</th></tr></thead><tbody id="rows"></tbody></table></div>
  <p id="empty" class="hide" style="color:var(--mute)">No LRs yet. Save one from the New LR tab and it appears here.</p>
 </section>
</main>
</div>
<div id="print"></div>
<div class="toast" id="toast"></div>
<datalist id="custs"></datalist>

['Shipper',[['sname','Name','t','Kingfa Science Technology- CHN','w','custs'],['saddr','Address','a','259/A Vadakkal Thattannor Village Road\nGovernment Fair Price Shop\nBeemanthangal C. Thattannor\nSriperumbudur Kancheepuram Tamil Nadu - 602105','w']]],
['Receiver',[['rname','Name','t','Amphenol FCI India Private Limited','w','custs'],['raddr','Address','a','VI/309-VI/324 Vettikkal Thiruvaniyoor\nRoad Mulanthuruthy Ernakulam-682 314','w']]],

 if(ty==='a')return `<label${c}>${lb}<textarea id="${id}">${esc(v)}</textarea></label>`;
 const it={t:'text',n:'number',d:'date',tm:'time'}[ty];
 return `<label${c}>${lb}<input id="${id}" type="${it}" value="${esc(v)}" ${dl?`list="${dl}"`:''} ${ty==='n'?'min="0" step="any" inputmode="decimal"':''}></label>`}).join('')+`</div></fieldset>`).join('');
let copyIdx=0,loadedId=null;
let H=[],NEXT={pmjs:1,pmjl:1},TOK='',ME=null;const allHist=()=>H;const hist=()=>H.filter(h=>h.co===cur);

function volw(d){const v=(+d.L||0)*(+d.W||0)*(+d.H||0)*(+d.dpcs||0)/5000;return v?v.toFixed(2):'0.00'}
function bars(n){let x=0,s='';const str='9'+String(n)+'9';for(const ch of str){const c=ch.charCodeAt(0);for(let k=0;k<4;k++){const w=1+((c>>k)&1)*1.5;if(k%2===0)s+=`<rect x="${x}" y="0" width="${w}" height="14"/>`;x+=w}x+=1}return `<svg width="${Math.min(x,120)}" height="14" viewBox="0 0 ${x} 14" preserveAspectRatio="none" fill="#111">${s}</svg>`}
function sheet(d,no,copy){
 const pd=d.pdate?d.pdate.split('-').reverse().join('-'):'';
 const c=CO();return `<div class="lr" style="--lc:${c.color}">
 <div class="top"><div class="brand">${c.logo?`<img class="logo" src="${c.logo}" alt="${c.logoText?'':esc(c.name)}">`:`<div class="logo">${esc(c.name)}</div>`}${c.logoText?`<div class="bt"><b>${esc(c.name)}</b>${c.tag?`<i>${esc(c.tag)}</i>`:''}</div>`:''}</div>
  <div class="no"><span class="cp">${copy}</span><br>LR NO${bars(no)}<b>${esc(no)}</b></div></div>
 <div class="cols">
  <div class="col">
   <div class="carrier">${esc(c.name)}${c.tag?`<br><i>${esc(c.tag)}</i>`:''}<br>${esc(c.addr).replace(/\n/g,'<br>')}<br>PAN : ${esc(c.pan)} &nbsp; GST : ${esc(c.gst)}<br>${c.mob?`Mob : ${esc(c.mob)} &nbsp; `:''}${esc(c.email)}${c.web?` &nbsp; ${esc(c.web)}`:''}</div>
   <div class="rl">FROM (SHIPPER Name And Address)</div><div class="bx" data-s="ship"><b>${esc(d.sname)}</b>\n${esc(d.saddr)}</div>
   <div class="rl">TO (RECEIVER Name And Address)</div><div class="bx" data-s="recv"><b>${esc(d.rname)}</b>\n${esc(d.raddr)}</div>
  </div>
  <div class="col">
   <div class="rt" data-s="route"><div><small>ORIGIN</small>${esc(d.origin).toUpperCase()}</div><div><small>DESTINATION</small>${esc(d.dest).toUpperCase()}</div></div>
   <div class="rl">CONSIGNMENT (SHIPMENT) DETAILS</div>
   <div class="kv" data-s="cons"><span>No of Pcs</span><b>${esc(d.pcs)} &nbsp; Act Wt ${esc(d.aw)}</b><span>Chrg Wgt (Kg)</span><b>${esc(d.cw)}</b><span>Goods Val (INR)</span><b>${esc(d.gv||'0.00')}</b><span>Invoice No</span><b>${esc(d.inv)}</b><span>Eway No</span><b>${esc(d.eway)}</b><span>Bill to</span><span>${esc(d.billto)}</span><span>GST payable by</span><span>${esc(d.gst)}</span></div>
   <div class="rl">DESCRIPTION OF GOODS (NON_DOCUMENTS)</div><div data-s="cons" style="min-height:5mm">${esc(d.desc)}</div>
   <div class="rl">Dimension in cm</div><div data-s="dim">L ${esc(d.L)} &nbsp; W ${esc(d.W)} &nbsp; H ${esc(d.H)} &nbsp; Pcs ${esc(d.dpcs)} &nbsp; | Volumetric Wt <b>${volw(d)}</b></div>
   <div class="mode" data-s="route"><span class="rl">TRANSIT MODE</span><div>${esc(d.transit).toUpperCase()}</div><span class="rl">PAYMENT MODE</span><div>${esc(d.pay).toUpperCase()}</div><span class="rl">PICKUP</span><div>${esc(d.staff)} | ${pd} ${esc(d.ptime)}</div><span class="rl">DELIVERY AT / VEHICLE</span><div>${esc(d.deliv).toUpperCase()} | ${esc(d.veh)}</div></div>
   <div class="kv" data-s="chg"><span>Freight</span><span>${esc(d.fr)}</span><span>Other charges</span><span>${esc(d.oc)}</span><span>GST subject to RCM</span><span>${esc(d.rcm)}</span></div>
   <div data-s="cons">Remarks: <b>${esc(d.rem)}</b></div>
  </div>
 </div>
 <div class="cq"><b>NON-NEGOTIABLE GTA CONSIGNMENT NOTE.</b> Goods are carried at owner's risk only. Services are only up to ground floor; the customer pays extra for delivery on higher floors at actual. Cheques to be drawn in favour of <b>${esc(c.cheque)}</b></div><div class="terms"><p>I/we have agreed to the terms &amp; conditions set on the reverse of the Consignor's copy &amp; declare that the contents of this C-note are true &amp; correct.<br>Consignor sign ____________ Date ______ Time ______</p><p>Received above shipment along with all the documents in good condition. I/we hereby agree to pay all charges including octroi &amp; taxes as applicable.<br>Sign / Mobile of consignee ________ Date ______ Time ______</p></div>
 <div class="foot">${[['Booking',c.book],['Delivery',c.deliv],['Support',c.supp]].filter(x=>x[1]).map(x=>`<span>${x[0]} ${esc(x[1])}</span>`).join('')||`<span>${esc(c.web||c.email)}</span>`}</div></div>`}
function curNo(){return loadedId?loadedId.no:nextNo()}
function render(){$('co').style.borderLeft='6px solid '+CO().color;const d=vals();$('preview').innerHTML=sheet(d,curNo(),COPIES[copyIdx]);mark();
 $('lrTitle').textContent=CO().name+' – LR no. '+curNo();$('uid').textContent=loadedId?'ID '+loadedId.id:'ID assigned on save'}
$('copyTabs').innerHTML=COPIES.map((c,i)=>`<button data-i="${i}" class="${i?'':'on'}">${c.replace(' copy','')}</button>`).join('');
$('copyTabs').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;copyIdx=+i;[...$('copyTabs').children].forEach((b,j)=>b.classList.toggle('on',j===copyIdx));render()};
$('f').addEventListener('input',e=>{if(e.target.id==='sname'||e.target.id==='rname'){const c=custs()[e.target.value];if(c){const a=$(e.target.id==='sname'?'saddr':'raddr');if(!a.value.trim()||a.dataset.auto)a.value=c;a.dataset.auto=1}}if(e.target.tagName==='TEXTAREA')delete e.target.dataset.auto;render()});
function custs(){const m={};hist().forEach(h=>{m[h.d.sname]=h.d.saddr;m[h.d.rname]=h.d.raddr});return m}
function fillCusts(){$('custs').innerHTML=Object.keys(custs()).map(n=>`<option value="${esc(n)}">`).join('')}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3800)}
function printAll(){const d=vals(),no=curNo();$('print').innerHTML=COPIES.map(c=>sheet(d,no,c)).join('');window.print()}
$('bSave').onclick=()=>{};
function addNew(){if(!$('newBtn')){const b=document.createElement('button');b.id='newBtn';b.textContent='New LR';b.onclick=()=>{$('newBtn').remove();blankForm()};$('bSave').before(b)}}
$('bPrint').onclick=()=>doSave(true);
$('bPdf').onclick=()=>{toast('In the print dialog, choose “Save as PDF” as the destination.');setTimeout(()=>doSave(true),900)};
$('bWa').onclick=()=>{const d=vals();window.open('https://wa.me/?text='+encodeURIComponent(`${CO().name} LR ${curNo()}\n${d.origin} to ${d.dest}\nPieces: ${d.pcs}, Weight: ${d.cw} kg\nVehicle: ${d.veh}`),'_blank')};
$('bMail').onclick=()=>{const d=vals();location.href='mailto:?subject='+encodeURIComponent('LR '+curNo()+' - '+CO().name)+'&body='+encodeURIComponent(`LR ${curNo()}\n${d.origin} to ${d.dest}\nPieces: ${d.pcs}, Weight: ${d.cw} kg\nVehicle: ${d.veh}`)};
$('logoIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{COS[cur].logo=r.result;saveCos();render()};r.readAsDataURL(f)};
function rows(){const q=$('q').value.toLowerCase(),mine=$('mine').checked,h=hist().filter(x=>(!mine||x.by===(ME&&ME.id))&&JSON.stringify([x.no,x.id,x.d,x.by]).toLowerCase().includes(q));
 $('rows').innerHTML=h.map(x=>`<tr class="r" data-id="${esc(x.id)}"><td><b>${x.no}</b></td><td>${esc(x.id)}</td><td>${esc(x.d.pdate)}</td><td>${esc(x.d.sname)}</td><td>${esc(x.d.rname)}</td><td>${esc(x.d.pcs)} / ${esc(x.d.cw)}</td><td>${esc(x.by)}</td><td>${x.rc||''}</td></tr>`).join('');
 $('cnt').textContent=h.length+' LR'+(h.length===1?'':'s');$('empty').classList.toggle('hide',hist().length>0)}
$('q').oninput=rows;
$('rows').onclick=e=>{const tr=e.target.closest('tr');if(!tr)return;openDet(hist().find(h=>h.id===tr.dataset.id))};
function show(v){[['new','vNew','tNew'],['hist','vHist','tHist'],['co','vCo','tCo'],['usr','vUsr','tUsr']].forEach(([k,a,b])=>{$(a).classList.toggle('hide',v!==k);$(b).classList.toggle('on',v===k)});if(v==='hist')rows();if(v==='co')coForm();if(v==='usr')loadUsers()}
$('tNew').onclick=()=>show('new');$('tHist').onclick=()=>{show('hist');refresh()};$('tCo').onclick=()=>show('co');$('tUsr').onclick=()=>show('usr');
const CF=[['name','Company name'],['tag','Tagline (printed under the name)'],['addr','Address','a'],['pan','PAN'],['gst','GST no.'],['mob','Phone numbers'],['book','Booking number'],['deliv','Delivery number'],['supp','Customer support number'],['email','Email'],['web','Website'],['cheque','Cheques in favour of'],['pre','Unique ID prefix'],['color','Brand colour','c']];
function coForm(){const c=CO();$('coForm').innerHTML=CF.map(([k,l,t])=>`<label class="${t==='a'?'w':''}">${l}${t==='a'?`<textarea data-k="${k}">${esc(c[k])}</textarea>`:`<input data-k="${k}" type="${t==='c'?'color':'text'}" value="${esc(c[k])}">`}</label>`).join('');$('coNote').textContent='Editing '+c.name+'. Its LR numbers, saved customers and history are kept separate from the other company. Next LR no. is '+nextNo()+'.'}
$('coForm').oninput=e=>{const k=e.target.dataset.k;if(!k)return;COS[cur][k]=e.target.value;saveCos();fillSel();render()};
function fillSel(){$('co').innerHTML=Object.values(COS).map(c=>`<option value="${c.id}"${c.id===cur?' selected':''}>${esc(c.name)}</option>`).join('')}
$('co').onchange=()=>{cur=$('co').value;S.set('lr_cur',cur);loadedId=null;if($('newBtn'))$('newBtn').remove();fillCusts();coForm();rows();render()};
$('logoIn2').onchange=$('logoIn').onchange;
const REQ=[['sname','Shipper name'],['rname','Receiver name'],['pcs','No. of pieces'],['aw','Actual weight']];
const saveCore=$('bSave').onclick;
async function doSave(print){IDS.forEach(i=>$(i).classList.remove('bad'));const miss=REQ.filter(([i])=>!$(i).value.trim());
 if(miss.length){miss.forEach(([i])=>$(i).classList.add('bad'));$(miss[0][0]).focus();toast('Fill in: '+miss.map(m=>m[1]).join(', '));return}
 if(!loadedId&&!(await saveRemote()))return;if(print)printAll()}
$('bSave').onclick=()=>doSave(false);$('bSP').onclick=()=>doSave(true);
$('bRep').onclick=()=>{const x=hist()[0];if(!x){toast('No saved LR to repeat yet.');return}IDS.forEach(i=>$(i).value=x.d[i]);loadedId=null;if($('newBtn'))$('newBtn').remove();render();toast('Details copied from LR '+x.no+'. Change what differs, then save.')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();doSave(false)}
 if(e.key==='Enter'&&e.target.matches('#f input')){e.preventDefault();const f=[...$('f').querySelectorAll('input,select,textarea')],i=f.indexOf(e.target);if(f[i+1])f[i+1].focus()}});
$('f').addEventListener('input',e=>{if(e.target.id==='cw')e.target.dataset.man=1;
 if(['aw','L','W','H','dpcs'].includes(e.target.id)&&!$('cw').dataset.man){$('cw').value=Math.max(+$('aw').value||0,+volw(vals()))||'';render()}});
let act='';function mark(){$('preview').querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('act',e.dataset.s===act))}
$('f').addEventListener('focusin',e=>{const fs=e.target.closest('fieldset');if(fs){act=fs.dataset.s;mark()}});
const API='https://script.google.com/macros/s/AKfycbz2qJvbwIK_ClDP0F3hHZ5bk-OmoQ4h2tFKCpPwmIB7JiCM3eQr32BZYT0jzdysaI8Z/exec';
async function api(a,p){let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a,t:TOK},p||{}))})}catch(e){throw new Error('Cannot reach the server. Check the internet connection and the API link.')}
 const j=await r.json();if(j.err==='auth'){logout(true);throw new Error('Session expired. Please log in again.')}if(j.err)throw new Error(j.err);return j}
function blankForm(){IDS.forEach(i=>{const e=$(i);if(e.tagName==='SELECT')e.selectedIndex=0;else e.value=''});$('pdate').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);$('ptime').value=new Date().toTimeString().slice(0,5);if(ME)$('staff').value=ME.name;delete $('cw').dataset.man;loadedId=null;if($('newBtn'))$('newBtn').remove();render()}
async function refresh(){try{const j=await api('list');H=j.lrs;NEXT=Object.assign(NEXT,j.next);fillCusts();rows();render()}catch(e){toast(e.message)}}
async function saveRemote(){$('bSave').disabled=$('bSP').disabled=true;try{const d=vals(),j=await api('save',{co:cur,d});loadedId={no:j.no,id:j.id};H.unshift({co:cur,no:j.no,id:j.id,saved:new Date().toISOString(),by:ME.id,rc:0,d});NEXT[cur]=j.no+1;render();fillCusts();addNew();toast('Saved as LR '+j.no+' ('+j.id+') and added to the Google Sheet.');return true}catch(e){toast(e.message);return false}finally{$('bSave').disabled=$('bSP').disabled=false}}
async function login(){$('lgErr').textContent='';$('lgGo').disabled=true;try{start(await api('login',{id:$('lgId').value.trim(),pass:$('lgPw').value}))}catch(e){$('lgErr').textContent=e.message}finally{$('lgGo').disabled=false}}
function start(j){TOK=j.t;ME=j;try{localStorage.setItem('lr_tok',JSON.stringify(j))}catch(e){}$('login').classList.add('hide');$('lgPw').value='';$('who').textContent=j.name+' ('+j.role+')';$('tUsr').classList.toggle('hide',j.role!=='admin');blankForm();refresh()}
function logout(q){TOK='';ME=null;try{localStorage.removeItem('lr_tok')}catch(e){}$('login').classList.remove('hide');H=[];if(!q)$('lgId').focus()}
function boot(){let s=null;try{s=JSON.parse(localStorage.getItem('lr_tok')||'null')}catch(e){}if(s&&s.t)start(s);else $('lgId').focus()}
$('lgGo').onclick=login;$('lgPw').onkeydown=e=>{if(e.key==='Enter')login()};$('bOut').onclick=()=>logout();
$('bPw').onclick=async()=>{const p=prompt('New password (at least 6 characters)');if(!p)return;try{await api('mypass',{pass:p});toast('Password changed.')}catch(e){toast(e.message)}};
$('mine').onchange=rows;$('bRef').onclick=refresh;
function openLR(x){IDS.forEach(i=>$(i).value=x.d[i]??'');loadedId={no:x.no,id:x.id};render();addNew()}
function openDet(x){const el=$('det');el.classList.remove('hide');el.innerHTML=`<fieldset data-s="cons"><legend>LR ${x.no} – ${esc(x.id)}</legend><div>${esc(x.d.sname)} to ${esc(x.d.rname)}. ${esc(x.d.origin)} to ${esc(x.d.dest)}, ${esc(x.d.pcs)} pcs, ${esc(x.d.cw)} kg. Created by ${esc(x.by)}.</div><div class="bar"><button id="dOpen">Open in form</button><button id="dPrint">Print 4 copies</button><button id="dClose">Close</button></div><div id="rmL">Loading remarks…</div><label>Add a remark<textarea id="rmT" maxlength="1000"></textarea></label><div class="bar"><button class="pri" id="rmAdd">Add remark</button></div></fieldset>`;
 $('dClose').onclick=()=>el.classList.add('hide');$('dOpen').onclick=()=>{openLR(x);show('new')};$('dPrint').onclick=()=>{openLR(x);show('new');printAll()};
 $('rmAdd').onclick=async()=>{const t=$('rmT').value.trim();if(!t)return toast('Type a remark first.');try{await api('remark',{id:x.id,text:t});x.rc=(x.rc||0)+1;$('rmT').value='';rows();loadRem(x)}catch(e){toast(e.message)}};loadRem(x);el.scrollIntoView()}
async function loadRem(x){try{const j=await api('remarks',{id:x.id});$('rmL').innerHTML=j.rem.length?j.rem.map(r=>`<p style="margin:4px 0"><b>${esc(r.by)}</b> <small>${esc(new Date(r.t).toLocaleString())}</small><br>${esc(r.text)}</p>`).join(''):'<p style="color:var(--mute)">No remarks yet.</p>'}catch(e){$('rmL').textContent=e.message}}
async function loadUsers(){try{const j=await api('users');$('uRows').innerHTML=j.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.active?'Active':'Disabled'}</td><td><button data-a="rp" data-id="${esc(u.id)}">Reset password</button> <button data-a="ac" data-id="${esc(u.id)}">${u.active?'Disable':'Enable'}</button></td></tr>`).join('');
 $('nxt').innerHTML=Object.values(COS).map(c=>`<label>${esc(c.name)}<input type="number" min="1" id="n_${c.id}" value="${NEXT[c.id]||1}" style="width:120px"></label><button data-a="nx" data-id="${c.id}">Set</button>`).join(' ')}catch(e){toast(e.message)}}
$('vUsr').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,id=b.dataset.id;try{
 if(b.id==='uAdd'){await api('adduser',{id:$('uId').value.trim(),name:$('uNm').value.trim(),pass:$('uPw').value,role:$('uRl').value});['uId','uNm','uPw'].forEach(i=>$(i).value='');toast('User added.')}
 else if(a==='rp'){const p=prompt('New password for '+id+' (at least 6 characters)');if(!p)return;await api('resetpass',{id,pass:p});toast('Password reset.')}
 else if(a==='ac'){await api('active',{id})}
 else if(a==='nx'){const n=+$('n_'+id).value;await api('setnext',{co:id,n});NEXT[id]=n;toast('Next LR number saved.')}
 else return;loadUsers()}catch(e){toast(e.message)}};
fillSel();fillCusts();render();boot();
</script></body></html>
