<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track your shipment</title><script src="config.js"></script>
<style>body{margin:0;background:#dfe1e3;color:#1c2430;font:14px/1.5 Verdana,Tahoma,Arial,sans-serif}header{background:#25364f;color:#fff;padding:12px 18px;border-bottom:3px double #b9a766;font:bold 18px Georgia,serif}main{max-width:520px;margin:18px auto;padding:0 14px}.p{background:#f7f7f5;border:1px solid #7f8791;padding:14px;box-shadow:2px 2px 0 #c9cdd2}input,button{font:inherit;padding:7px;border:1px solid #333;border-radius:0}input{width:100%;margin:6px 0;box-sizing:border-box}button{background:#25364f;color:#fff;font-weight:bold;cursor:pointer}ol{list-style:none;padding:0}li{padding:6px 0 6px 14px;border-left:4px solid #b9a766;margin-left:6px}li.on{font-weight:bold;border-color:#25364f}li.todo{color:#7a828c;border-color:#c9cdd2}</style></head>
<body><header>Track your shipment</header><main><div class="p"><label>LR tracking ID<input id="i" placeholder="e.g. PMJL-1101-AB12"></label><button id="g">Track</button><div id="o" style="margin-top:12px"></div></div></main>
<script>
const $=id=>document.getElementById(id),S=['Booked','In transit','Delivered','POD received'],esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function go(){const id=$('i').value.trim();if(!id)return;$('o').textContent='Looking up…';try{const r=await fetch(window.LR_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a:'track',id})}),j=await r.json();if(j.err){$('o').textContent=j.err;return}
 const at=S.indexOf(j.st),tm={};j.steps.forEach(x=>tm[x.s]=new Date(x.t).toLocaleString());
 $('o').innerHTML=`<b>${esc(j.co)}</b><br>LR ${j.no}: ${esc(j.origin)} to ${esc(j.dest)}<br>${esc(j.pcs)} pcs, booked ${esc(j.date)}<ol>`+S.map((s,i)=>`<li class="${i<=at?(i==at?'on':''):'todo'}">${s}${tm[s]?' <small>'+tm[s]+'</small>':''}</li>`).join('')+'</ol>'}catch(e){$('o').textContent='Could not reach the server. Please try again.'}}
$('g').onclick=go;$('i').onkeydown=e=>{if(e.key==='Enter')go()};const q=new URLSearchParams(location.search).get('id');if(q){$('i').value=q;go()}
</script></body></html>
